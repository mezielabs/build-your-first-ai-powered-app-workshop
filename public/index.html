<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Writing assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Writing assistant</h1>
        <button id="new-conversation" type="button">New conversation</button>
      </header>

      <section id="conversation" class="conversation" aria-live="polite">
        <p class="empty">Ask for a draft, then refine it with follow-ups like "make it shorter".</p>
      </section>

      <p id="error" class="error" role="alert" hidden></p>

      <form id="composer" class="composer">
        <label for="message" class="visually-hidden">Message</label>
        <textarea
          id="message"
          rows="3"
          placeholder="Write a short email asking my landlord to fix the leaking kitchen tap"
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Enter sends. Shift+Enter adds a new line.</p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
